name: Update SHMU radar for e-ink

on:
  workflow_dispatch:

  # Fallback only. QNAP cron is the primary 5-minute trigger.
  schedule:
    - cron: "2,17,32,47 * * * *"

  push:
    branches:
      - main
    paths:
      - "scripts/update_radar.py"
      - "base_map.png"
      - "requirements.txt"
      - ".github/workflows/update-radar.yml"

permissions:
  contents: write

concurrency:
  group: shmu-radar-update
  cancel-in-progress: false

jobs:
  update-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync latest main
        run: |
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate latest radar images
        run: |
          python scripts/update_radar.py

      - name: Verify generated files
        run: |
          test -f latest.png
          test -f latest_arrow.png
          test -f latest_info.json
          test -f index.html

      - name: Update HTML cache version
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path

          info = json.loads(Path("latest_info.json").read_text(encoding="utf-8"))
          dt = datetime.fromisoformat(info["latest_radar_utc"].replace("Z", "+00:00"))
          version = dt.strftime("%Y%m%d%H%M%S")

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          new_html, count = re.subn(
              r'latest_arrow\.png\?v=\d+',
              f'latest_arrow.png?v={version}',
              html,
              count=1,
          )

          if count != 1:
              raise RuntimeError(
                  "index.html does not contain exactly one latest_arrow.png?v=<digits> marker"
              )

          p.write_text(new_html, encoding="utf-8")
          print(f"HTML radar cache version: {version}")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest.png latest_arrow.png latest_info.json index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update SHMU radar"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
