<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="refresh" content="300">
  <title>SHMÚ radar e-ink</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <img id="radar" alt="SHMÚ radar">

  <script>
    const RADAR_URL =
      "https://raw.githubusercontent.com/adykub-3dee/shmuradarsk/main/latest_arrow.png";

    function loadLatestRadar() {
      const img = document.getElementById("radar");
      img.src = RADAR_URL + "?t=" + Date.now();
    }

    loadLatestRadar();

    // Obnov obrázok každých 5 minút aj bez reloadu celej stránky.
    setInterval(loadLatestRadar, 300000);
  </script>
</body>
</html>
