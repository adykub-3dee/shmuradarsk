<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="refresh" content="300">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>SHMÚ radar e-ink</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <img id="radar" src="latest_arrow.png?v=20260906153000" alt="SHMÚ radar">
  <script>
    const radar = document.getElementById("radar");
    function refreshRadar() {
      const base = radar.src.split("?")[0];
      radar.src = base + "?t=" + Date.now();
    }
    setInterval(refreshRadar, 300000);
  </script>
</body>
</html>
